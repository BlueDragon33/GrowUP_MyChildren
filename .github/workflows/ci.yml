name: GrowUP Development Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growup-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.webmanifest
          test -f sw.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('app.webmanifest','utf8'))"
