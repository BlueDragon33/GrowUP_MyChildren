name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify source and tests
        run: npm run verify

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned Playwright and accessibility audit runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium E2E and accessibility audit
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee playwright-output.log
      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-output.log
            test-results/
          if-no-files-found: warn
          retention-days: 7
