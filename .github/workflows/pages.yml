name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: growup-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect GitHub Pages availability
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/pages.json --write-out '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/pages")"
          if [[ "$code" == "200" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repo. Development continues; live Pages publish is skipped."
          fi

      - name: Preserve development site artifact
        uses: actions/upload-artifact@v4
        with:
          name: growup-development-site
          path: .
          if-no-files-found: error
          retention-days: 3

      - name: Configure Pages
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Development publish summary
        if: always()
        run: |
          if [[ "${{ steps.detect.outputs.enabled }}" == "true" ]]; then
            echo "GrowUP Pages publish executed."
          else
            echo "GrowUP development artifact saved; live Pages requires one-time repository Pages enablement."
          fi
