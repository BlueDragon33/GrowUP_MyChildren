name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed PWA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          test -n "$PAGE_URL"
          curl --fail --location --retry 5 --retry-delay 5 "${BASE}" | grep -q "GrowUP My Children"
          curl --fail --location --retry 5 --retry-delay 5 "${BASE}app.webmanifest" | grep -q '"name"'
          curl --fail --location --retry 5 --retry-delay 5 "${BASE}sw.js" | grep -q "growup-mychildren-v6"
